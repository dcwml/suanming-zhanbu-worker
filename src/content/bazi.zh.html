<div class="bazi-app" id="bazi-app" data-lang="zh">
  <h1>八字排盘</h1>
  <p class="lead">输入出生时间，在线排出四柱八字，并获取命局、大运与流年流月解读。</p>

  <form class="bazi-form" id="bazi-form">
    <fieldset class="bazi-field">
      <legend>历法</legend>
      <label><input type="radio" name="calendar" value="solar" checked> 公历</label>
      <label><input type="radio" name="calendar" value="lunar"> 农历</label>
      <label id="bazi-leap-wrap" hidden><input type="checkbox" id="bazi-leap"> 闰月</label>
    </fieldset>
    <div class="bazi-field">
      <label>年 <input type="number" id="bazi-year" min="1900" max="2100" value="1990" required></label>
      <label>月 <input type="number" id="bazi-month" min="1" max="12" value="1" required></label>
      <label>日 <input type="number" id="bazi-day" min="1" max="31" value="1" required></label>
      <label>时辰
        <select id="bazi-hour">
          <option value="0">早子时 23:00-00:59（归当日）</option>
          <option value="2">丑时 01:00-02:59</option>
          <option value="4">寅时 03:00-04:59</option>
          <option value="6">卯时 05:00-06:59</option>
          <option value="8">辰时 07:00-08:59</option>
          <option value="10">巳时 09:00-10:59</option>
          <option value="12" selected>午时 11:00-12:59</option>
          <option value="14">未时 13:00-14:59</option>
          <option value="16">申时 15:00-16:59</option>
          <option value="18">酉时 17:00-18:59</option>
          <option value="20">戌时 19:00-20:59</option>
          <option value="22">亥时 21:00-22:59</option>
          <option value="23">晚子时 23:00-23:59（归次日）</option>
        </select>
      </label>
    </div>
    <fieldset class="bazi-field">
      <legend>性别</legend>
      <label><input type="radio" name="gender" value="male" checked> 男</label>
      <label><input type="radio" name="gender" value="female"> 女</label>
    </fieldset>
    <button type="submit" class="bazi-submit">排盘</button>
    <p class="bazi-form-error" id="bazi-form-error" role="alert" hidden></p>
  </form>

  <section id="bazi-result" class="bazi-result" hidden aria-live="polite"></section>

  <section id="bazi-interpret" class="bazi-interpret" hidden>
    <h2>命理解读</h2>
    <p class="bazi-disclaimer">以下解读仅供娱乐参考，不构成任何专业建议。</p>
    <article class="bazi-card" id="card-bazi"><h3>八字命局解读</h3><div class="bazi-card-body"></div></article>
    <article class="bazi-card" id="card-dayun"><h3>大运解读</h3><div class="bazi-card-body"></div></article>
    <article class="bazi-card" id="card-liunian"><h3>流年流月解读</h3><div class="bazi-card-body"></div></article>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.7.5/lunar.min.js" defer onerror="var s=document.createElement('script');s.src='https://cdn.staticfile.org/lunar-javascript/1.7.5/lunar.min.js';document.head.appendChild(s)"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
<script src="/assets/bazi.js" defer></script>
